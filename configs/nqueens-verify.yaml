# N-Queens *verification* — watch a model reason, then commit to a verdict.
#
# Why verification and not "solve it": solving N-Queens sends a model off for
# thousands of chain-of-thought tokens with no ground truth to check it against
# until the very end (see nqueens-solve.yaml for that). Verification gives you a
# bounded ~250-token argument you can actually read line by line, against a board
# whose answer is known exactly — and it still ends on a single "Yes"/"No" token
# that Direct Logit Attribution and the causal grid can target.
#
# So this config gives you both halves of the picture:
#   the REASONING  — the step-by-step text, and the entropy timeline over it
#   the VERDICT    — one attributable decision token on the final line
#
# The board (4x4, one queen per row, 1-indexed columns):
#     row 1 -> col 2      . Q . .
#     row 2 -> col 4      . . . Q
#     row 3 -> col 1      Q . . .
#     row 4 -> col 3      . . Q .
#   columns  {2,4,1,3}      all distinct  -> no column conflict
#   row-col  {-1,-2,2,1}    all distinct  -> no  \  diagonal conflict
#   row+col  {3,6,4,7}      all distinct  -> no  /  diagonal conflict
#   => VALID. (One of exactly two 4-queens solutions; the other is its mirror.)
#
# This config is the POSITIVE half of a minimal pair. Run `nqueens-conflict.yaml`
# for the negative half: the same board with rows 3 and 4 swapped, which keeps all
# four columns distinct and fails on a single anti-diagonal pair. The two prompts
# differ by two tokens, so `token-heatmap diff` isolates the activations that
# carry "diagonal conflict" and nothing else.
#
# What to look for:
#   - Read generated.txt first. Does the argument actually check all six pairs,
#     or does it assert "no two share a diagonal" without doing the arithmetic?
#     A model can reach the right verdict through a wrong argument, and the text
#     is the only place that shows.
#   - Entropy timeline: where does the model hesitate? Expect low entropy while
#     it restates the board and spikes at the points where it commits to a
#     comparison — those are the tokens worth opening in the step detail.
#   - Logit Lens on the verdict token: at which depth does "Yes" overtake "No"?
#     A model that genuinely computed the constraint should flip late; one
#     pattern-matching on "looks like a puzzle answer" commits early and coasts.
#   - Direct Logit Attribution on the verdict token: which layers/heads write it.
#     Expand to per-head and compare against the conflict run.
#   - Causal grid: ablate each (layer, prompt token). If a real diagonal check
#     exists, ablating the row-3 / row-4 column tokens should flip the answer.
#
# Caveat worth holding onto: the reasoning text is output, not a transcript of
# the computation. It can be fluent and post-hoc. The causal pass is what turns
# "it said it checked the diagonals" into evidence that it did.
#
# Reproduce (HPC):   token-heatmap hpc run configs/nqueens-verify.yaml --gpu l40s
# Local big GPU:     token-heatmap trace --config configs/nqueens-verify.yaml --serve --frontend
#
# Model note: 4x4 diagonal checking is beyond a 0.5B — it will answer by vibes,
# which the Logit Lens shows clearly and is itself a legitimate result. 7B-Instruct
# is the smallest that gets it right often enough to be worth attributing.

model: Qwen/Qwen2.5-7B-Instruct
use_chat_template: true

prompt: |
  A 4-queens placement puts exactly one queen in each row of a 4x4 board.
  It is valid only if no two queens share a column, and no two queens share a diagonal.

  Placement: row 1 -> column 2, row 2 -> column 4, row 3 -> column 1, row 4 -> column 3.

  Work through it step by step:
  1. List the four (row, column) pairs.
  2. Check the columns are all distinct.
  3. For every pair of queens, compare row-column and row+column — a match on
     either means those two share a diagonal.
  Then end your reply with a final line of exactly "Answer: Yes" or "Answer: No".

# Length: enough to watch the model reason, short enough that full capture stays
# cheap and the trace stays readable. The earlier 8-token version answered in a
# single word — crisp for attribution, but there was no reasoning to observe,
# which is the point of this config. ~250 tokens covers listing four queens and
# checking six pairs.
max_new_tokens: 320

# Near-greedy: this is a decision, not a sample. Temperature exists only so the
# probe still records a non-degenerate distribution to read entropy off.
temperature: 0.1
top_p: 0.95
min_k: 8
max_k: 64
mass_threshold: 0.95

out: outputs/nqueens-verify

# Every lens on — the run is 8 tokens, so full capture costs little.
capture_logit_lens: true
lens_layers: all
lens_top_k: 8

capture_attention: true
capture_full_attention: true
attention_layers: all

capture_activations: true
capture_full_activations: true
activation_top_k: 8
