# N-Queens *verification* — a constraint-satisfaction decision in one token.
#
# Why verification and not "solve it": solving N-Queens makes a model emit
# hundreds of chain-of-thought tokens, and every lens here is per-token — the
# answer smears across the trace and nothing lines up. Verification collapses the
# whole problem onto a SINGLE decision token after "Answer:", which is exactly
# the shape the Logit Lens and Direct Logit Attribution are built to read.
#
# The board (4x4, one queen per row, 1-indexed columns):
#     row 1 -> col 2      . Q . .
#     row 2 -> col 4      . . . Q
#     row 3 -> col 1      Q . . .
#     row 4 -> col 3      . . Q .
#   columns  {2,4,1,3}      all distinct  -> no column conflict
#   row-col  {-1,-2,2,1}    all distinct  -> no  \  diagonal conflict
#   row+col  {3,6,4,7}      all distinct  -> no  /  diagonal conflict
#   => VALID. (One of exactly two 4-queens solutions; the other is its mirror.)
#
# This config is the POSITIVE half of a minimal pair. Run `nqueens-conflict.yaml`
# for the negative half: the same board with rows 3 and 4 swapped, which keeps all
# four columns distinct and fails on a single anti-diagonal pair. The two prompts
# differ by two tokens, so `token-heatmap diff` isolates the activations that
# carry "diagonal conflict" and nothing else.
#
# What to look for:
#   - Logit Lens on step 0: at which depth does "Yes" overtake "No"? A model that
#     genuinely checks diagonals should flip late (the constraint has to be
#     computed); a model pattern-matching on "looks like a puzzle answer" commits
#     early and never moves.
#   - Direct Logit Attribution on step 0: which layers/heads write the answer
#     token. Expand to per-head and compare against the conflict run.
#   - Causal grid: ablate each (layer, prompt token). If a real diagonal check
#     exists, ablating the row-3 / row-4 column tokens should flip the answer.
#
# Reproduce (HPC):   token-heatmap hpc run configs/nqueens-verify.yaml --gpu l40s
# Local big GPU:     token-heatmap trace --config configs/nqueens-verify.yaml --serve --frontend
#
# Model note: 4x4 diagonal checking is beyond a 0.5B — it will answer by vibes,
# which the Logit Lens shows clearly and is itself a legitimate result. 7B-Instruct
# is the smallest that gets it right often enough to be worth attributing.

model: Qwen/Qwen2.5-7B-Instruct
use_chat_template: true

prompt: |
  A 4-queens placement puts exactly one queen in each row of a 4x4 board.
  It is valid only if no two queens share a column, and no two queens share a diagonal.

  Placement: row 1 -> column 2, row 2 -> column 4, row 3 -> column 1, row 4 -> column 3.

  Is this placement valid? Reply with exactly one word: Yes or No.
  Answer:

# Short on purpose: step 0 IS the experiment. The remaining tokens only confirm
# the model committed to the word it started. Full capture is affordable precisely
# because the generation is this short.
max_new_tokens: 8

# Near-greedy: this is a decision, not a sample. Temperature exists only so the
# probe still records a non-degenerate distribution to read entropy off.
temperature: 0.1
top_p: 0.95
min_k: 8
max_k: 64
mass_threshold: 0.95

out: outputs/nqueens-verify

# Every lens on — the run is 8 tokens, so full capture costs little.
capture_logit_lens: true
lens_layers: all
lens_top_k: 8

capture_attention: true
capture_full_attention: true
attention_layers: all

capture_activations: true
capture_full_activations: true
activation_top_k: 8
