name: Compile

# Fast compile gate on *every* push and PR (any branch). Catches syntax /
# type errors in seconds, before the heavier CI workflow (tests + Tauri build,
# main/PR only) runs. No torch install, no full build — just "does it compile".
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Byte-compile all Python sources
        run: python -m compileall -q llm_token_heatmap tests examples

  frontend:
    name: Frontend compile (tsc --noEmit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile
        run: npm run typecheck
